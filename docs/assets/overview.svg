<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 260" role="img" aria-labelledby="title desc">
  <title id="title">Make Next Graph：从真实成果继续</title>
  <desc id="desc">目标、依赖和验收进入只读计算器，宿主补齐下一份真实成果，再重新观察已有产物。</desc>
  <defs>
    <linearGradient id="surface" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef6ff"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#0f766e"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker>
  </defs>
  <rect x="1" y="1" width="1098" height="258" rx="22" fill="url(#surface)" stroke="#dbe5ee"/>
  <g font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif">
    <text x="42" y="42" font-size="11" font-weight="700" letter-spacing="2" fill="#64748b">MAKE NEXT GRAPH</text>
    <text x="42" y="77" font-size="24" font-weight="700" fill="#0f172a">成果留下来，任务接着走。</text>
    <rect x="42" y="113" width="254" height="86" rx="12" fill="#fff" stroke="#d5e1eb"/>
    <rect x="59" y="131" width="5" height="48" rx="2" fill="#0f766e"/>
    <text x="80" y="147" font-size="17" font-weight="700" fill="#0f172a">目标 · 依赖 · 验收</text>
    <text x="80" y="174" font-size="13" fill="#64748b">把需要的成果说明白</text>
    <path d="M296 156H378" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="391" y="113" width="260" height="86" rx="12" fill="url(#accent)"/>
    <text x="521" y="147" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">next · 只读计算</text>
    <text x="521" y="174" text-anchor="middle" font-size="13" fill="#e0f2fe">读取产物，找出当前缺口</text>
    <path d="M651 156H733" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="746" y="113" width="310" height="86" rx="12" fill="#fff" stroke="#d5e1eb"/>
    <text x="769" y="147" font-size="17" font-weight="700" fill="#0f172a">宿主补齐下一份成果</text>
    <text x="769" y="174" font-size="13" fill="#64748b">原生工具执行，按实际内容验收</text>
    <path d="M901 199V225H521V199" fill="none" stroke="#0f766e" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
    <rect x="616" y="212" width="182" height="25" rx="8" fill="#f1f7fc"/>
    <text x="707" y="229" text-anchor="middle" font-size="12" fill="#0f766e">真实产物落盘，再次观察</text>
  </g>
</svg>
